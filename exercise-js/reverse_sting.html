<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="demo"></div>
  <script>
    let name=prompt("Enter a string:");
    for(let i=name.length;i>0;i--){
      document.getElementById("demo").innerHTML+=(name[i-1]);
    }
  </script>
</body>
</html>
