<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="calculator.css">
  <script src="calculator.js" defer></script>
  <title>Document</title>
</head>
<body>
  <div class="container">
    <div class="screen">
      <input type="text" class="display" readonly>
    </div>
    <div class="buttons">
      <button>AC</button>
      <button>DEL</button>
      <button>(</button>
      <button>)</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>*</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>-</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>
      <button>.</button>
      <button>0</button>
      <button>/</button>
      <button>=</button>
    </div>
  </div>
</body>
</html>
