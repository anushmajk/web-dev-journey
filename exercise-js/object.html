<body>
  <div id="demo"></div>

  <div id="demo1"></div>
  <script>
    //task1
    let student={
      name:"Anushma",

    };

    student.age=21;

         console.log(a+b);

      }
    }

    //task5
    let product={

    //task6
    let students = [
  { name: "A", marks: 80 },
  { name: "B", marks: 45 },
  { name: "C", marks: 60 }
];
let data="";
let filtered="";
let sum=0;
for (let i=0; i<students.length;i++){
  data+=students[i].name +' : '  + students[i].marks + "<br>";
  if(students[i].marks>=50){
    filtered+=students[i].name +' : '  + students[i].marks + "<br>";
  }
  sum+=students[i].marks
}
let average=(sum)/students.length;
document.getElementById("abc").innerHTML=data;
document.getElementById("anu").innerHTML=filtered;
document.getElementById("demo1").innerHTML="Average is:" + average;
  </script>
