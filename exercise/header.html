<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .header{
      display:flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top:0;
      left:0;
      right:0;
    }
    .left-section{
      display:flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <header class="header">
<div class="left-section">
  <img class="hamburger-menu" src="hamburger-menu.svg" alt="hamburger-menu">
  <img class="yt-icon" src="youtube-logo.svg" alt="yt-icon">
</div>
<div class="middle-section"></div>
<input type="text" placeholder="search">
<button class="search-button">
  <img class="search-img" src="search.svg">
</button>
<div class="right-section">
  <img class="yt app" src="youtube-apps.svg" alt="yt app">
  <img class="notifications" src="notifications.svg">
  <img class="profile" src="anu.jpg">
</div>
  </header>
</body>
</html>
