<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      background-color: lightblue;
    }
    p{
      background-color: lightcoral;
       opacity: 0.5;
    }
  </style>
</head>
<body>
  <div>
    <h1>Opacity Example</h1>
    <p>
      This is an example of using the CSS opacity property. The text below has an opacity of 0.5, making it semi-transparent.
    </p>
  </div>
</body>
</html>
