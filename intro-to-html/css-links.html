<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    a{
      color: blue;
      text-decoration: none;
    }
    a:visited{
      color: purple;
    }
    a:hover{
      color: red;
      text-decoration: underline;
    }
    a:active{
      color: green;
    }
    
  </style>
</head>
<body>
  <a href="https://www.google.com" target="_parent">Google</a><br>
  <a href="https://www.facebook.com" target="_blank">Facebook</a><br>
  <a href="https://www.instagram.com" target="_self">Instagram</a><br>
  <a href="https://www.youtube.com" target="_top">YouTube</a><br>
</body>
</html>
