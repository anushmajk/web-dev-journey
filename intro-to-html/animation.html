<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div{
      width: 100px;
      height: 100px;
      background-color: lightblue;
    }
    div:hover{
      animation: moveBox 2s linear forwards;
    }
    @keyframes moveBox {
      0% { transform: translateX(0); }
      100% { transform: translateX(200px); }
    }
  </style>
</head>
<body>
  <div></div>
</body>
</html>
