<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <p id="demo1"></p>
  <p id="demo2"></p>
  <p id="demo3"></p>
  <p id="demo4"></p>
  <p id="demo5"></p>
  <p id="demo6"></p>
  <p id="demo7"></p>
  <p id="demo8"></p>
  <p id="demo9"></p>
  <script>
    const d=new Date();
    document.getElementById("demo1").innerHTML=d;
    const year= d.getFullYear();
    document.getElementById("demo2").innerHTML=year;
     const month= d.getMonth()+1;
    document.getElementById("demo3").innerHTML=month;
    const date=d.getDate();
    document.getElementById("demo4").innerHTML=date;
    const day=d.getDay();
    document.getElementById("demo5").innerHTML=day;
    const hour=d.getHours();
    document.getElementById("demo6").innerHTML=hour;
    const min=d.getMinutes();
    document.getElementById("demo7").innerHTML=min;
    const sec=d.getSeconds();
    document.getElementById("demo8").innerHTML=sec;
    const time=d.getTime();
    document.getElementById("demo9").innerHTML=time;
  </script>
</body>
</html>
